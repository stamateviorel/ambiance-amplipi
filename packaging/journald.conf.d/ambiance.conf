# Ambiance AmpliPi — systemd-journald drop-in.
#
# Persist the journal across reboots so a crash, a self-heal, or a reboot can be
# diagnosed AFTER the fact. The base Raspberry Pi image ships Storage=volatile, which
# keeps the journal in RAM and wipes it on every reboot — i.e. it throws away exactly the
# logs you want. A drop-in overrides the main journald.conf, so this survives OS upgrades.
#
# Bounded so the SD card stays safe. Pairs with access_log=False in asgi.py, which keeps
# the journal signal-only (a few lines/day instead of ~100k uvicorn access lines).
#
# Install to /etc/systemd/journald.conf.d/ambiance.conf (see scripts/setup-logging.sh).
[Journal]
Storage=persistent
SystemMaxUse=100M
RuntimeMaxUse=64M
